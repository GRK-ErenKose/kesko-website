<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Yapım Aşamasında</title>

  <style>
    :root {
      --background: #101e28
;
      --cream: #f5efe3
;
      --muted: #b8c4c7
;
      --accent: #f5a66a
;
      --line: rgba(245, 239, 227, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(245, 166, 106, 0.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(184, 196, 199, 0.08), transparent 28%),
        var(--background);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 900px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(16, 30, 40, 0.8);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.28);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .page::before {
      width: 320px;
      height: 320px;
      top: -180px;
      right: -100px;
      border: 1px solid rgba(245, 166, 106, 0.25);
    }

    .page::after {
      width: 220px;
      height: 220px;
      bottom: -130px;
      left: -90px;
      border: 1px solid rgba(184, 196, 199, 0.2);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .brand {
      color: var(--cream);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .status {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .content {
      max-width: 650px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin-bottom: 24px;
      color: var(--cream);
      font-size: clamp(42px, 8vw, 82px);
      line-height: 0.98;
      letter-spacing: -0.06em;
      font-weight: 700;
    }

    .description {
      max-width: 540px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.6;
    }

    .progress {
      width: min(100%, 420px);
      height: 3px;
      margin-top: 42px;
      overflow: hidden;
      background: rgba(245, 239, 227, 0.16);
      border-radius: 10px;
    }

    .progress span {
      display: block;
      width: 58%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      animation: loading 2.4s ease-in-out infinite alternate;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .footer-text {
      color: var(--cream);
      font-size: 14px;
      font-weight: 500;
    }

    .dot {
      width: 9px;
      height: 9px;
      display: inline-block;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .year {
      color: var(--muted);
      font-size: 12px;
    }

    @keyframes loading {
      from {
        width: 35%;
      }

      to {
        width: 75%;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.45;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @media (max-width: 600px) {
      .page {
        min-height: 580px;
        padding: 30px 24px;
        border-radius: 20px;
      }

      .top,
      .footer {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        font-size: clamp(42px, 14vw, 68px);
      }

      .footer {
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <div class="brand">YENİ BİR BAŞLANGIÇ</div>
      <div class="status">SİTE YAPIM AŞAMASINDA</div>
    </header>

    <section class="content">
      <h1>Güzel şeyler hazırlanıyor.</h1>

      <p class="description">
        Yeni deneyimimiz üzerinde özenle çalışıyoruz.
        Çok yakında burada buluşacağız.
      </p>

      <div class="progress" aria-label="Site hazırlık durumu">
        <span></span>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-text">
        <span class="dot"></span>
        Yakında buradayız.
      </div>

      <div class="year">
        © 2026
      </div>
    </footer>
  </main>
</body>
</html>
